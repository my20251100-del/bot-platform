<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="256" r="140" fill="#00d4ff" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Cyber Circuit Elements -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="14 20" opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-dasharray="8 28" opacity="0.25"/>

  <!-- Hatem X Modern Brand Mark -->
  <!-- Left to right diagonal with arrow tails -->
  <path d="M 140 140 L 372 372" stroke="url(#cyanGrad)" stroke-width="48" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Right to left diagonal -->
  <path d="M 372 140 L 140 372" stroke="url(#neonGreen)" stroke-width="48" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Core Node -->
  <circle cx="256" cy="256" r="32" fill="#06080d" stroke="#ffffff" stroke-width="6"/>
  <circle cx="256" cy="256" r="16" fill="#00f2fe"/>

  <!-- Mini signal dots -->
  <circle cx="140" cy="140" r="12" fill="#00f2fe"/>
  <circle cx="372" cy="140" r="12" fill="#00ff87"/>
  <circle cx="140" cy="372" r="12" fill="#00ff87"/>
  <circle cx="372" cy="372" r="12" fill="#00f2fe"/>
</svg>
