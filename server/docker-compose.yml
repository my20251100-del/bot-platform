# =============================================================
# WhatsApp Bot backend — Docker Compose
# -------------------------------------------------------------
# Run the exact same container locally or on Back4App.
#   docker compose up --build
#
# On Back4App Deploy: point it at the `Dockerfile` (Node 22) and
# keep the `whatsapp-sessions` volume so bots stay linked across
# restarts / redeploys.
# =============================================================
services:
  bot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-bot-backend:latest
    container_name: whatsapp-bot-backend
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - .env          # SUPABASE_URL, SERVICE_ROLE_KEY, GEMINI_API_KEY ...
    environment:
      PORT: "10000"
      NODE_ENV: production
      # Matches the mounted volume below so LocalAuth persists.
      WA_SESSION_DIR: /app/.sessions
    volumes:
      - whatsapp-sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/ping').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  whatsapp-sessions:
    driver: local
